    tag: hashnet-integration

  port: 8080

  service:
    type: ClusterIP
    port: 8080

  existingSecret:
    enabled: true
    name: access-node-secret
    key: dlt-private-key

  env:
    DEBUG: "*"
    PRIVATE_KEY: "0x78085aac97a972a7c0fa6ea3276dd5237543a31b7b3ac310545146e4b4aa05c3"
