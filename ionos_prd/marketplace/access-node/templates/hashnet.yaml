{{- $hashnet := .Values.hashnet -}}
{{- $ied := index .Values "dome-ied" -}}
{{- if $ied.enabled -}}
  {{- if not $hashnet.enabled -}}
    {{- fail "Enable hashnet before enabling dome-ied" -}}
  {{- end -}}
  {{- $_ := required "Set the QA-approved dome-ied.ied.image.tag before enabling the bridge" $ied.ied.image.tag -}}
  {{- $_ := required "Set dome-ied.ied.env.internalSubscriptionMetadata to the PROD event filter" $ied.ied.env.internalSubscriptionMetadata -}}
{{- end -}}
{{- if $hashnet.enabled -}}
{{- /* dlt-adapter chart 8.0.0 does not render HASHNET_NETWORK_ID. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlt-adapter-hashnet
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: dlt-adapter-hashnet
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dlt-adapter-hashnet
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dlt-adapter-hashnet
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with $hashnet.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dlt-adapter-hashnet
          image: {{ printf "%s:%s" (required "Set hashnet.image.repository" $hashnet.image.repository) (required "Set the QA-approved hashnet.image.tag" $hashnet.image.tag) | quote }}
          imagePullPolicy: {{ $hashnet.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 31
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          env:
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set hashnet.existingSecret.name to the PROD signing Secret" $hashnet.existingSecret.name | quote }}
                  key: {{ required "Set hashnet.existingSecret.key to the PROD signing key entry" $hashnet.existingSecret.key | quote }}
            - name: DEBUG
              value: {{ $hashnet.env.DEBUG | quote }}
            {{- range $name := list "RPC_ADDRESS" "HASHNET_NETWORK_ID" "DOME_EVENTS_CONTRACT_ADDRESS" "DOME_EVENTS_CONTRACT_ABI" "DOME_PRODUCTION_BLOCK_NUMBER" "ISS" }}
            - name: {{ $name }}
              value: {{ required (printf "Set hashnet.env.%s to the PROD value" $name) (index $hashnet.env $name) | quote }}
            {{- end }}
          resources:
            {{- toYaml $hashnet.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dlt-adapter-hashnet
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: dlt-adapter-hashnet
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dlt-adapter-hashnet
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
