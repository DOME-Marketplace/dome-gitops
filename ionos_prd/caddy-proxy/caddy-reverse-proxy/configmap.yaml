apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-routes-config
  namespace: caddy-proxy
data:
  sbx-site.caddy: |
    
    knowledgebase.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 10MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }
