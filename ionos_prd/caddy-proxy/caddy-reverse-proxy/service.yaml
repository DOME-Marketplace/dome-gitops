apiVersion: v1
kind: Service
metadata:
  name: caddy-reverse-proxy-balancer
  labels: { app: caddy-reverse-proxy }
  annotations:
    cloud.ionos.com/node-selector: cloud.ionos.com/nodepool-name=ingress-pool-2
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  loadBalancerIP: 212.132.64.84
  selector: { app: caddy-reverse-proxy }
  ports:
    - { name: https, port: 443, targetPort: https, protocol: TCP }
    - { name: http,  port: 80,  targetPort: http,  protocol: TCP }
