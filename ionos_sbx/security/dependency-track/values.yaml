# OWASP Dependency-Track: central platform for SBOMs and component
# vulnerabilities. Chart 2.10.0 (app 5.2.2).
# Postgres runs in-cluster (extraObjects below). Credentials and the KEK come
# from dependency-track-secret (keys: username, password, kek).

database:
  jdbcUrl: "jdbc:postgresql://dependency-track-postgres:5432/dtrack?reWriteBatchedInserts=true"
  existingSecret:
    name: dependency-track-secret

secretManagement:
  database:
    kek:
      existingSecret:
        name: dependency-track-secret

# Caddy sends everything for this address to the frontend, but the web page
# calls the API on the same address (/api/...). The frontend's nginx therefore
# passes /api/ on to the API server (config in extraObjects below).
frontend:
  additionalVolumes:
    - name: nginx-config
      configMap:
        name: dependency-track-frontend-nginx
  additionalVolumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/templates/default.conf.template
      subPath: default.conf.template

ingress:
  enabled: false
  ingressClassName: caddy-reverse-proxy
  hostname: dependency-track.dome-marketplace-sbx.org
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-sbx-issuer
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    - secretName: dependency-track-tls
      hosts:
        - dependency-track.dome-marketplace-sbx.org

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: dependency-track-postgres
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dependency-track-postgres
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: dependency-track-postgres
      template:
        metadata:
          labels:
            app: dependency-track-postgres
        spec:
          containers:
            - name: postgres
              image: postgres:17-alpine
              env:
                - name: POSTGRES_DB
                  value: dtrack
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dependency-track-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dependency-track-secret
                      key: password
                # Subdirectory: the volume root holds lost+found, which initdb rejects.
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              ports:
                - containerPort: 5432
              readinessProbe:
                exec:
                  command: ["pg_isready"]
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: dependency-track-postgres
  - apiVersion: v1
    kind: Service
    metadata:
      name: dependency-track-postgres
    spec:
      selector:
        app: dependency-track-postgres
      ports:
        - port: 5432
  # nginx config of the frontend: the image's own template, plus /api/.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: dependency-track-frontend-nginx
    data:
      default.conf.template: |
        server {
          listen      8080;
          server_name _;

          location /api/ {
            proxy_pass           http://dependency-track-api-server.security.svc.cluster.local:8080;
            client_max_body_size 10m;
            proxy_read_timeout   300s;
          }

          location / {
            root      /opt/owasp/dependency-track-frontend;
            index     index.html;
            try_files $uri $uri/ /index.html;

            location ~ (config\.json|index\.html)$ {
              add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
              add_header Pragma "no-cache";
              add_header Expires 0;
            }

            sub_filter '<base href=/'  '<base href=${BASE_PATH}';
            sub_filter_once on;
          }

          error_page 500 502 503 504 /50x.html;

          location = /50x.html {
            root /usr/share/nginx/html;
          }
        }
