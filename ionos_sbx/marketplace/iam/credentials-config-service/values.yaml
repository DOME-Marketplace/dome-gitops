credentials-config-service:

  # Image
  deployment:
    image: 
      repository: quay.io/fiware/credentials-config-service
      tag: 1.0.1
    resources:
      requests:
        cpu: "10m"
        memory: "384Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"

  # Database config
  database:
    persistence: true
    host: mysql-til
    name: ccs
    username: root

    existingSecret:
      enabled: true
      name:  mysql-secret
      key: mysql-root-password