mysql:
  namespace: marketplace 
  fullnameOverride: mysql-til
  image:
    repository: bitnamilegacy/mysql
    tag: 8.0.31-debian-11-r10
  auth:
    existingSecret: mysql-secret
  initdbScripts:
    create.sql: |
      CREATE DATABASE til;
      CREATE DATABASE ccs;
      
  primary:
    podAnnotations:
      backup.velero.io/backup-volumes: data
    resources:
      requests:
        cpu: "50m"
        memory: "768Mi"
      limits:
        cpu: "200m"
        memory: "1Gi"    

  labels:
    app.kubernetes.io/name: mysql-til    