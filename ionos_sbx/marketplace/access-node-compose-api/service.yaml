apiVersion: v1
kind: Service
metadata:
  name: access-node-compose-api
  namespace: marketplace
spec:
  type: ClusterIP   # exposed publicly through the Caddy reverse proxy
  selector:
    app.kubernetes.io/instance: access-node-compose-api
    app.kubernetes.io/name: access-node-compose-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
