# Ingress gestito da INGRESS-NGINX: stessa applicazione del pod #1 ma sul
# percorso attuale (LoadBalancer di nginx, stesso IP di tutti gli altri host
# *.dome-marketplace-sbx.org).
#
# Serve come controllo positivo: se qualcosa non funziona anche qui, il
# problema non e' Caddy. Il confronto dei due dump di echo-server evidenzia le
# differenze di header inoltrati (Host, X-Forwarded-For, X-Forwarded-Proto,
# X-Real-IP, gestione del path).
#
# TLS: ClusterIssuer standard di SBX, il cui solver HTTP01 usa gia'
# `ingressClassName: nginx` (ionos_sbx/cert-manager/templates/issuer.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-via-nginx
  namespace: test-caddy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-sbx-issuer
spec:
  ingressClassName: nginx
  rules:
    - host: tmf-test-nginx.dome-marketplace-sbx.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-via-nginx
                port:
                  number: 8080
  tls:
    - hosts:
        - tmf-test-nginx.dome-marketplace-sbx.org
      secretName: echo-via-nginx-tls
