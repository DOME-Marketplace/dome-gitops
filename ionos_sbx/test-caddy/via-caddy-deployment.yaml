# Pod #1 - esposto tramite il LoadBalancer di CADDY (senza passare da nginx).
# echo-server risponde con il dump della richiesta (headers, host, path,
# X-Forwarded-*): serve a vedere cosa Caddy inoltra all'upstream e a
# confrontarlo con quello che inoltra nginx sul pod #2, a parita' di immagine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-via-caddy
  namespace: test-caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: echo-via-caddy
      app.kubernetes.io/name: echo-via-caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: echo-via-caddy
        app.kubernetes.io/name: echo-via-caddy
    spec:
      containers:
        - name: echo-via-caddy
          image: ealen/echo-server:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOGS__IGNORE__PING
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
