# Pod #2 - esposto tramite ingress-nginx, il percorso attuale in produzione.
# Stessa immagine e stessa configurazione del pod #1: e' il termine di paragone.
# Se il pod #1 (Caddy) si comporta diversamente, la differenza e' del reverse
# proxy e non dell'applicazione.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-via-nginx
  namespace: test-caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: echo-via-nginx
      app.kubernetes.io/name: echo-via-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: echo-via-nginx
        app.kubernetes.io/name: echo-via-nginx
    spec:
      containers:
        - name: echo-via-nginx
          image: ealen/echo-server:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOGS__IGNORE__PING
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
