# Ingress gestito da CADDY (non da nginx).
#
# `ingressClassName: caddy` e' l'unico discriminante: il Caddy Ingress
# Controller e' configurato con classNameRequired=true, quindi prende in carico
# solo gli Ingress che lo dichiarano esplicitamente. Nessuna annotation
# nginx.ingress.kubernetes.io/* qui: non avrebbe effetto.
#
# TLS: cert-manager emette il certificato Let's Encrypt e lo salva nel secret
# test-caddy-tls-secret; Caddy lo serve tramite spec.tls[].secretName.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-caddy-exposed-ingress
  namespace: test-caddy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-caddy-test-issuer
spec:
  ingressClassName: caddy
  rules:
    - host: tmf-test.dome-marketplace-sbx.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-caddy-exposed-svc
                port:
                  number: 8080
  tls:
    - hosts:
        - tmf-test.dome-marketplace-sbx.org
      secretName: test-caddy-tls-secret
