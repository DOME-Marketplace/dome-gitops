# Pod #2 - SENZA INGRESS, raggiungibile solo dentro il cluster.
# Serve come controllo negativo: verifica che Caddy non esponga nulla che non
# abbia un Ingress con class "caddy", e come target per i test service-to-service
# (es. chiamate dal pod esposto verso questo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-caddy-internal-deployment
  namespace: test-caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: test-caddy-internal
      app.kubernetes.io/name: test-caddy-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: test-caddy-internal
        app.kubernetes.io/name: test-caddy-internal
    spec:
      containers:
        - name: test-caddy-internal-container
          image: ealen/echo-server:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOGS__IGNORE__PING
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
