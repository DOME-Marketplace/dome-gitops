# Pod #1 - RAGGIUNGIBILE DALL'ESTERNO tramite Caddy
# echo-server risponde con il dump della richiesta (headers, host, path,
# X-Forwarded-*): serve a verificare cosa Caddy inoltra all'upstream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-caddy-exposed-deployment
  namespace: test-caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: test-caddy-exposed
      app.kubernetes.io/name: test-caddy-exposed
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: test-caddy-exposed
        app.kubernetes.io/name: test-caddy-exposed
    spec:
      containers:
        - name: test-caddy-exposed-container
          image: ealen/echo-server:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOGS__IGNORE__PING
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
