apiVersion: v1
kind: Service
metadata:
  name: caddy-reverse-proxy-balancer
  labels: { app: caddy-reverse-proxy }
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: caddy-reverse-proxy }
  ports:
    - { name: https, port: 443, targetPort: 8443, protocol: TCP }
    - { name: http,  port: 80,  targetPort: 8080, protocol: TCP }