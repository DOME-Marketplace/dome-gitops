apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-routes-config
  namespace: caddy-proxy
data:
  sbx-site.caddy: |
    
    tmf-test.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /tmf-test/get-route* {
            reverse_proxy account.tmf-test.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /payment/* {
            reverse_proxy payment.billing.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /cs-identity/* {
            reverse_proxy cs-identity-keycloak.cs-identity.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /access-node-compose-api/* {
            reverse_proxy access-node-compose-api.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }
       
        handle /* {
            
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {

                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle {
            respond "Not Found" 404
        }
        handle_errors {
            respond "Error {err.status_code}" {err.status_code}
        }
    }

    ticketing.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    knowledgebase.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    analytics.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy superset-service.analytics.svc.cluster.local:8088 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    dome-certification.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy certification-frontend-svc.dome-certification.svc.cluster.local:80 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    dome-certification-api.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle_path /* {
            reverse_proxy certification-backend-svc.dome-certification.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }
    
    dependency-track.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy dependency-track-frontend.security.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    desmos.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        # Public Desmos API used by other access nodes:
        #   GET  /api/v2/entities/{id}        entities of blockchain events
        #   POST /api/v2/sync/p2p/discovery   P2P synchronization (discovery)
        #   POST /api/v2/sync/p2p/entities    P2P synchronization (entities)
        @desmos_public path /api/v2/entities* /api/v2/sync/p2p/discovery /api/v2/sync/p2p/entities
        handle @desmos_public {
            reverse_proxy desmos.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    # A P2P discovery on a node with data takes tens of seconds
                    response_header_timeout 300s
                }
            }
        }

        # Any other path: explicit 404 instead of Caddy's default empty 200
        handle {
            respond 404
        }
    }

    tmf.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /tmf-api/* {
            reverse_proxy tm-forum-api.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    grafana.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /* {
            reverse_proxy kube-prometheus-stack-grafana.kube-prometheus-stack.svc.cluster.local:80 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }

    payment.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /payment/notify {
            reverse_proxy payment-scheduler-svc.billing.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }
    }

    manage.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 1MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }

        handle /subscriptions* {
            reverse_proxy subscriptions-management-svc.billing.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }
    }

    cs-identity.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        handle {
            header_up X-Forwarded-Port 443
            reverse_proxy cs-identity-keycloak.cs-identity.svc.cluster.local:80 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }        
        }  
    }