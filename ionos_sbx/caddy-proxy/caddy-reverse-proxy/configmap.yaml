apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-routes-config
  namespace: caddy-proxy
data:
  sbx-site.caddy: |
    (dome_verifier_upstream) {
        reverse_proxy verifier-marketplace-dome-verifier.marketplace.svc.cluster.local:80 {
            flush_interval -1
            header_down Location "^https?://([a-z0-9-]+\.)?dome-marketplace-sbx\.org(:[0-9]+)?/" "/"
            header_down Location "^/" "/verifier/"
            header_down Location "^/verifier/verifier([/?#]|$)" "/verifier${1}"
            header_down Location "^/verifier/(bae|auth)([/?#]|\$)" "/${1}${2}"
            transport http {
                dial_timeout            5s
                response_header_timeout 60s
            }
        }
    }

    tmf-test.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }
        rate_limit {
            zone static {
                match {
                    not remote_ip 127.0.0.1
                    path_regexp \.(js|css|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)\$
                }
                key    {client_ip}
                events 1000
                window 1m
            }
            zone api {
                match {
                    not remote_ip 127.0.0.1
                    not path_regexp \.(js|css|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)\$
                }
                key    {client_ip}
                events 300
                window 1m
            }
        }
        request_body {
            max_size 1MB
        }
        header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
            X-Content-Type-Options    "nosniff"
            X-Frame-Options           "SAMEORIGIN"
            Referrer-Policy           "same-origin"
            Permissions-Policy        "geolocation=(), camera=(), microphone=()"

            Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:"

            -Server
            -X-Powered-By
        }

        @compressible not path /verifier/qr-socket/* /bae/verifier/qr-socket/*
        encode @compressible zstd gzip

        handle /tmf-test/get-route* {
            reverse_proxy account.tmf-test.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/productCatalogManagement/v4* {
            reverse_proxy tm-forum-api-product-catalog.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/accountManagement* {
            reverse_proxy tm-forum-api-account.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @bae_bad_came_from expression `{http.request.uri.query.came_from} != "" && !{http.request.uri.query.came_from}.matches("^/($|[^/\\\\])")`
        handle @bae_bad_came_from {
            respond "Bad Request" 400
        }

        @bae_index_internal {
            path /__bae_index
            remote_ip 127.0.0.1
        }
        handle @bae_index_internal {
            rewrite * /
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004
        }

        @bae_config_internal {
            path /__bae_config
            remote_ip 127.0.0.1
        }
        handle @bae_config_internal {
            rewrite * /config
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004
        }

        @bae_config {
            path /config /bae/config
        }
        handle @bae_config {
            header Content-Type  "application/json; charset=utf-8"
            header Cache-Control "no-store"
            templates {
                mime    application/json
                between <<caddy caddy>>
            }
            # Riscrive verifierHost puntando a https://tmf-test.dome-marketplace-sbx.org/verifier
            respond `<<caddy regexReplaceAll "\"verifierHost\"\\s*:\\s*\"[^\"]*\"" (httpInclude "/__bae_config") "\"verifierHost\":\"https://tmf-test.dome-marketplace-sbx.org/verifier\"" caddy>>` 200
        }

        @verifier_login_internal {
            path /__verifier_login
            remote_ip 127.0.0.1
        }
        handle @verifier_login_internal {
            rewrite * /login?{query}
            import dome_verifier_upstream
        }

        @bae_verifier_legacy path_regexp bae_ver ^/bae/verifier(.*)\$
        handle @bae_verifier_legacy {
            redir * /verifier{re.bae_ver.1}?{query} 302
        }

        @verifier_login path /verifier/login /verifier /verifier/
        handle @verifier_login {
            header Content-Type  "text/html; charset=utf-8"
            header Cache-Control "no-store"
            templates {
                between <<caddy caddy>>
            }
            respond `<<caddy httpInclude (print "/__verifier_login?" (.Req.URL.RawQuery | replace "homeUri=https%3A%2F%2Fdome-marketplace-sbx.org" "homeUri=https%3A%2F%2Ftmf-test.dome-marketplace-sbx.org%2Fbae" | replace "homeUri=https://dome-marketplace-sbx.org" "homeUri=https://tmf-test.dome-marketplace-sbx.org/bae")) | replace "new SockJS('/qr-socket')" "new SockJS('/verifier/qr-socket')" | replace "window.location.href = message.body;" "window.location.href = message.body.replace('https://dome-marketplace-sbx.org/', 'https://tmf-test.dome-marketplace-sbx.org/');" | replace "https://dome-marketplace-sbx.org" "https://tmf-test.dome-marketplace-sbx.org/bae" caddy>>` 200
        }

        @verifier {
            path /verifier/*
            not path /verifier/ /verifier/login
        }
        handle @verifier {
            uri strip_prefix /verifier
            import dome_verifier_upstream
        }

        @verifier_dependencies {
            header_regexp Referer ^https://tmf-test\.dome-marketplace-sbx\.org/verifier([/?#]|\$)
            not path /verifier /verifier/* /bae /bae/* /__bae_index /__bae_config /__verifier_login /config /auth/* /tmf-api/* /tmf-test/* /ticketing/* /helpdesk/* /desmos/* /payment/* /cs-identity/* /bookstack/*
        }
        handle @verifier_dependencies {
            import dome_verifier_upstream
        }

        @bae {
            path /bae /bae/*
            not path /bae/verifier /bae/verifier/* /bae/config
        }
        handle @bae {
            @bae_hashed path_regexp ^/bae/[A-Za-z0-9_-]+\.[0-9a-f]{16}\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp)\$
            header @bae_hashed >Cache-Control "max-age=31536000, immutable"

            uri strip_prefix /bae
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_up X-Forwarded-Prefix /bae
                header_down Location "^https?://dome-marketplace-sbx\.org(:[0-9]+)?/" "/bae/"
                header_down Location "^/(bae(/|\$))?" "/bae/"
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }

                @spa_index {
                    status 200
                    header Content-Type text/html*
                }
                handle_response @spa_index {
                    header Content-Type  "text/html; charset=utf-8"
                    header Cache-Control "no-cache"
                    templates {
                        between <<caddy caddy>>
                    }
                    respond `<<caddy httpInclude "/__bae_index" | replace "<base href=\"/\">" "<base href=\"/bae/\">" caddy>>` 200
                }
            }
        }

        @bae_auth path /auth/*
        handle @bae_auth {
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_down Location "^https?://dome-marketplace-sbx\.org(:[0-9]+)?/" "/bae/"
                header_down Location "^/(bae(/|\$))?" "/bae/"
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @bae_nav {
            header_regexp Referer ^https://tmf-test\.dome-marketplace-sbx\.org/bae([/?#]|\$)
            header Accept *text/html*
            not path /bae /bae/* /verifier /verifier/* /__bae_index /__bae_config /__verifier_login /config /auth/* /tmf-api/* /tmf-test/* /ticketing/* /helpdesk/* /desmos/* /payment/* /cs-identity/* /bookstack/*
        }
        handle @bae_nav {
            redir * /bae{uri} 302
        }

        @bae_from_page {
            header_regexp Referer ^https://tmf-test\.dome-marketplace-sbx\.org/bae([/?#]|\$)
            not header_regexp Referer ^https://tmf-test\.dome-marketplace-sbx\.org/bae/verifier([/?#]|\$)
            not path /bae /bae/* /verifier /verifier/* /__bae_index /__bae_config /__verifier_login /config /auth/* /tmf-api/* /tmf-test/* /ticketing/* /helpdesk/* /desmos/* /payment/* /cs-identity/* /bookstack/*
        }
        handle @bae_from_page {
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_down Location "^https?://dome-marketplace-sbx\.org(:[0-9]+)?/" "/bae/"
                header_down Location "^/(bae(/|\$))?" "/bae/"
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle_path /ticketing/* {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
                header_up X-Forwarded-Prefix /ticketing

                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @zammad_dependencies {
            header Referer *tmf-test.dome-marketplace-sbx.org/ticketing*
        }
        handle @zammad_dependencies {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
            }
        }

        handle_path /helpdesk/* {
            reverse_proxy zammad2-nginx.zammad2.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
                header_up X-Forwarded-Prefix /helpdesk

                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @zammad2_dependencies {
            header Referer *tmf-test.dome-marketplace-sbx.org/helpdesk*
        }
        handle @zammad2_dependencies {
            reverse_proxy zammad2-nginx.zammad2.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
            }
        }

        handle /desmos/api/v2/entities* {
            reverse_proxy desmos.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /payment/* {
            reverse_proxy payment.billing.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /cs-identity/* {
            reverse_proxy cs-identity-keycloak.cs-identity.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @bookstack_internal {
            path /__bookstack /__bookstack/*
            remote_ip 127.0.0.1
        }
        handle @bookstack_internal {
            uri strip_prefix /__bookstack
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                header_up Accept-Encoding identity
            }
        }

        redir /bookstack /bookstack/ 308
        handle_path /bookstack/* {
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                header_up Accept-Encoding identity
                header_down Location "^https?://knowledgebase\.dome-marketplace-sbx\.org" "https://tmf-test.dome-marketplace-sbx.org/bookstack"

                @bookstack_page {
                    status 200
                    header Content-Type text/html*
                }

                handle_response @bookstack_page {
                    header Content-Type "text/html; charset=utf-8"
                    templates {
                        between "[[DOME_SEC_8f9a2b]]" "[[END_DOME_SEC]]"
                    }
                    respond `[[DOME_SEC_8f9a2b]] httpInclude (print "/__bookstack" .Req.URL.RequestURI) | replace "https://knowledgebase.dome-marketplace-sbx.org" "https://tmf-test.dome-marketplace-sbx.org/bookstack" [[END_DOME_SEC]]` 200
                }
            }
        }

        @bookstack_dependencies {
            header Referer *tmf-test.dome-marketplace-sbx.org/bookstack*
            not path /bookstack /bookstack/*
        }
        handle @bookstack_dependencies {
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
            }
        }


        handle /analytics/* {
            reverse_proxy superset-service.analytics.svc.cluster.local:8088 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle {
            respond "Not Found" 404
        }
        handle_errors {
            respond "Error {err.status_code}" {err.status_code