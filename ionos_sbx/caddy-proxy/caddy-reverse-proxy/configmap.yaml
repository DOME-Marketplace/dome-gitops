        rate_limit {
            zone static {
                match {
                    not remote_ip 127.0.0.1 ::1
                }
                key    {client_ip}
                events 1000
                window 1m
            }
            zone api {
                match {
                    not remote_ip 127.0.0.1 
                }
                key    {client_ip}
                events 300
                window 1m
            }
        }

        # The P2P discovery request carries the MV list of every replicable entity of the calling node
        request_body {
            max_size 20MB
        }

        header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
            X-Content-Type-Options    "nosniff"
            X-Frame-Options           "SAMEORIGIN"
            Referrer-Policy           "same-origin"
            Permissions-Policy        "geolocation=(), camera=(), microphone=()"

            Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:"
            -Server
            -X-Powered-By
        }

        encode zstd gzip

        # Public Desmos API used by other access nodes:
        #   GET  /api/v2/entities/{id}        entities of blockchain events
        #   POST /api/v2/sync/p2p/discovery   P2P synchronization (discovery)
        #   POST /api/v2/sync/p2p/entities    P2P synchronization (entities)
        @desmos_public path /api/v2/entities* /api/v2/sync/p2p/discovery /api/v2/sync/p2p/entities
        handle @desmos_public {
            reverse_proxy desmos.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    # A P2P discovery on a node with data takes tens of seconds
                    response_header_timeout 300s
                }
            }
        }

        # Any other path: explicit 404 instead of Caddy's default empty 200
        handle {
            respond 404
        }
    }

