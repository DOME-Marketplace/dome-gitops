apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-routes-config
  namespace: caddy-proxy
data:
  sbx-site.caddy: |
    tmf-test.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }
        rate_limit {
            zone per_ip {
                key    {remote_host}
                events 100
                window 1m
            }
        }
        request_body {
            max_size 1MB
        }
        header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
            X-Content-Type-Options    "nosniff"
            X-Frame-Options           "SAMEORIGIN"
            Referrer-Policy           "same-origin"
            Permissions-Policy        "geolocation=(), camera=(), microphone=()"
            -Server
            -X-Powered-By
        }
        encode zstd gzip
        
        handle /tmf-test/get-route* {
            reverse_proxy account.tmf-test.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/productCatalogManagement/v4* {
            reverse_proxy tm-forum-api-product-catalog.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/accountManagement* {
            reverse_proxy tm-forum-api-account.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }        
                
        handle_path /ticketing* {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                
                header_up X-Forwarded-Host {host}
                header_up X-Forwarded-Prefix /ticketing

                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @zammad_dependencies {
            header Referer *tmf-test.dome-marketplace-sbx.org/ticketing*
        }
        handle @zammad_dependencies {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
            }
        }


        handle_path /bae* {
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_up X-Forwarded-Host {host}
                header_up X-Forwarded-Prefix /bae                
            }
        }

        # 2. Intercetta gli SVG e asset visivi specifici del BAE
        @bae_assets {
            path /assets/themes/bae/*
        }
        handle @bae_assets {
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_up X-Forwarded-Host {host}
            }
        }

        # 3. Intercetta la navigazione interna di Angular (che sovrascrive l'URL)
        handle /dashboard* {
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_up X-Forwarded-Host {host}
            }
        }

        # 4. Intercetta chiamate orfane (JS, CSS, /config) verificando la provenienza
        @from_bae {
            header_regexp Referer tmf-test\.dome-marketplace-sbx\.org/(bae|dashboard)
        }
        handle @from_bae {
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {
                header_up X-Forwarded-Host {host}
            }
        }


        handle /desmos/api/v2/entities* {
            reverse_proxy desmos.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                    }
            }
        }        


        handle /verifier-marketplace/* {
            reverse_proxy verifier-marketplace-vcverifier.marketplace.svc.cluster.local:3000 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                    }
            }
        }              
        
        handle /payment/* {
            reverse_proxy payment.billing.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                    }
            }
        }   

        handle /cs-identity/* {
            reverse_proxy cs-identity-keycloak.cs-identity.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                    }
            }
        }

        handle /bookstack/* {
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                    }
            }
        }

        handle {
            respond "Not Found" 404
        }
        handle_errors {
            respond "Error {err.status_code}" {err.status_code}
        }
    }