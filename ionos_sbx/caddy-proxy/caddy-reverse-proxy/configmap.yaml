apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-routes-config
  namespace: caddy-proxy
data:
  sbx-site.caddy: |
    
    tmf-test.dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }
        rate_limit {
            zone static {
                match {
                    not remote_ip 127.0.0.1 ::1
                    path_regexp \.(js|css|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$
                }
                key    {client_ip}
                events 1000
                window 1m
            }
            zone api {
                match {
                    not remote_ip 127.0.0.1 
                    not path_regexp \.(js|css|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$
                }
                key    {client_ip}
                events 300
                window 1m
            }
        }

        request_body {
            max_size 1MB
        }

        header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
            X-Content-Type-Options    "nosniff"
            X-Frame-Options           "SAMEORIGIN"
            Referrer-Policy           "same-origin"
            Permissions-Policy        "geolocation=(), camera=(), microphone=()"

            Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:"
            -Server
            -X-Powered-By
        }

        encode zstd gzip

        handle /tmf-test/get-route* {
            reverse_proxy account.tmf-test.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/party/v4* {
            reverse_proxy tm-forum-api-party-catalog.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }        

        handle /tmf-api/customerBillManagement/v4* {
            reverse_proxy tm-forum-api-customer-bill-management.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/customerManagement/v4* {
            reverse_proxy tm-forum-api-customer-management.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/productCatalogManagement/v4* {
            reverse_proxy tm-forum-api-product-catalog.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/productInventory/v4* {
            reverse_proxy tm-forum-api-product-inventory.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }        

        handle /tmf-api/productOrderingManagement/v4* {
            reverse_proxy tm-forum-api-product-ordering-management.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/resourceCatalog/v4* {
            reverse_proxy tm-forum-api-resource-catalog.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/resourceFunctionActivation/v4* {
            reverse_proxy tm-forum-api-resource-function-activation.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/resourceInventoryManagement/v4* {
            reverse_proxy tm-forum-api-resource-inventory.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/serviceCatalogManagement/v4* {
            reverse_proxy tm-forum-api-service-catalog.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/serviceInventory/v4* {
            reverse_proxy tm-forum-api-service-inventory.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }
        
        handle /tmf-api/accountManagement/v4* {
            reverse_proxy tm-forum-api-account.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }                

        handle /tmf-api/agreementManagement/v4* {
            reverse_proxy tm-forum-api-agreement.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/partyRoleManagement/v4* {
            reverse_proxy tm-forum-api-party-role.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/usageManagement/v4* {
            reverse_proxy tm-forum-api-usage-management.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }        

        handle /tmf-api/quoteManagement/v4* {
            reverse_proxy tm-forum-api-quote.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /tmf-api/document/v4* {
            reverse_proxy tm-forum-api-document-management.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }


        handle_path /ticketing/* {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
                header_up X-Forwarded-Prefix /ticketing
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @zammad_dependencies {
            header Referer *tmf-test.dome-marketplace-sbx.org/ticketing*
        }
        handle @zammad_dependencies {
            reverse_proxy zammad-nginx.zammad.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
            }
        }

        handle_path /helpdesk/* {
            reverse_proxy zammad2-nginx.zammad2.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
                header_up X-Forwarded-Prefix /helpdesk
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @zammad2_dependencies {
            header Referer *tmf-test.dome-marketplace-sbx.org/helpdesk*
        }
        handle @zammad2_dependencies {
            reverse_proxy zammad2-nginx.zammad2.svc.cluster.local:8080 {
                header_up X-Forwarded-Host {host}
            }
        }

        handle /desmos/api/v2/entities* {
            reverse_proxy desmos.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /payment/* {
            reverse_proxy payment.billing.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle /cs-identity/* {
            reverse_proxy cs-identity-keycloak.cs-identity.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        @bookstack_internal {
            path /__bookstack /__bookstack/*
            remote_ip 127.0.0.1 ::1
        }
        handle @bookstack_internal {
            uri strip_prefix /__bookstack
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                header_up Accept-Encoding identity
            }
        }

        redir /bookstack /bookstack/ 308
        handle_path /bookstack/* {
            reverse_proxy bookstack.knowledgebase.svc.cluster.local:8080 {
                header_up Accept-Encoding identity
                header_down Location "^https?://knowledgebase\.dome-marketplace-sbx\.org" "https://tmf-test.dome-marketplace-sbx.org/bookstack"

                @bookstack_page {
                    status 200
                    header Content-Type text/html*
                }

                handle_response @bookstack_page {
                    header Content-Type "text/html; charset=utf-8"
                    templates {
                        between "[[DOME_SEC_8f9a2b]]" "[[END_DOME_SEC]]"
                    }
                    respond `[[DOME_SEC_8f9a2b]] httpInclude (print "/__bookstack" .Req.URL.RequestURI) | replace "https://knowledgebase.dome-marketplace-sbx.org" "https://tmf-test.dome-marketplace-sbx.org/bookstack" [[END_DOME_SEC]]` 200
                }
            }
        }
       
        handle /* {
            
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {

                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle {
            respond "Not Found" 404
        }
        handle_errors {
            respond "Error {err.status_code}" {err.status_code}
        }
    }