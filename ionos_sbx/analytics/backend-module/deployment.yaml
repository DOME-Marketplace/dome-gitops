apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-module
  namespace: analytics
  labels:
    app.kubernetes.io/instance: backend-module
    app.kubernetes.io/name: backend-module
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-module
      app.kubernetes.io/name: backend-module
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: backend-module
        app.kubernetes.io/name: backend-module
    spec:
      containers:
        - name: backend-module
          image: docker.ramp.eu/dome/dome-matomo-backend-app@sha256:0f6ccd98af5666b17f95bc0e0d0520fcdf8aee691a42f71620c7ce0a6aa825b7
          env:
            - name: MATOMO_HISTORICAL_BACKFILL_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
