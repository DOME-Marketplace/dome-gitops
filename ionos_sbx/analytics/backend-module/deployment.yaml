apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-module
  namespace: analytics
  labels:
    app.kubernetes.io/instance: backend-module
    app.kubernetes.io/name: backend-module
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-module
      app.kubernetes.io/name: backend-module
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: backend-module
        app.kubernetes.io/name: backend-module
    spec:
      containers:
        - name: backend-module
          image: docker.ramp.eu/dome/dome-matomo-backend-app@sha256:b2be9f43848040fc5fec2fca13ff164ae63273fe0b0798a8d8006637058f5a5c
          env:
            - name: MATOMO_HISTORICAL_BACKFILL_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
