apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-module
  namespace: analytics
  labels:
    app.kubernetes.io/instance: backend-module
    app.kubernetes.io/name: backend-module
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-module
      app.kubernetes.io/name: backend-module
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: backend-module
        app.kubernetes.io/name: backend-module
    spec:
      containers:
        - name: backend-module
          image: docker.ramp.eu/dome/dome-matomo-backend-app@sha256:04b81b1e1e7629e5645d8773044233fc67e8ab881614d8859d67eb33538cb6ba
            env:
            - name: MATOMO_HISTORICAL_BACKFILL_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
