apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-caddy
  namespace: argocd
  labels:
    purpose: test
spec:
  destination:
    namespace: test-caddy
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ionos_sbx/test-caddy
    repoURL: https://github.com/DOME-Marketplace/dome-gitops
    # ATTENZIONE - da riportare a `HEAD` prima del merge su main.
    # Durante il test i manifest esistono solo su questo branch: con `HEAD`
    # Argo leggerebbe il branch di default (main), dove ionos_sbx/test-caddy
    # non c'e' ancora, e l'Application resterebbe vuota.
    targetRevision: test-caddy-integration
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Il namespace viene creato qui e NON in ionos_common/namespaces, che e'
      # condiviso con dev / dev2 / prd: cosi' test-caddy esiste solo in SBX.
      - CreateNamespace=true
