apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caddy-ingress
  namespace: argocd
  labels:
    purpose: infra
spec:
  destination:
    namespace: caddy-ingress
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ionos_sbx/caddy-ingress
    repoURL: https://github.com/DOME-Marketplace/dome-gitops
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
