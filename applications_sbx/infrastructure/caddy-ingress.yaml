apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caddy-ingress
  namespace: argocd
  labels:
    purpose: infra
spec:
  destination:
    namespace: caddy-ingress
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ionos_sbx/caddy-ingress
    repoURL: https://github.com/DOME-Marketplace/dome-gitops
    # ATTENZIONE - da riportare a `HEAD` prima del merge su main.
    # Durante il test i manifest esistono solo su questo branch: con `HEAD`
    # Argo leggerebbe il branch di default (main), dove ionos_sbx/caddy-ingress
    # non c'e' ancora, e l'Application resterebbe vuota.
    targetRevision: test-caddy-integration
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
