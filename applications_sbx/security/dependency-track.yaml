apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dependency-track
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    purpose: security
spec:
  project: default
  sources:
  - repoURL: https://dependencytrack.github.io/helm-charts
    targetRevision: 2.6.0
    chart: dependency-track
    helm:
      releaseName: dependency-track
      valueFiles:
      - $values/ionos_sbx/security/dependency-track/values.yaml
  - repoURL: https://github.com/DOME-Marketplace/dome-gitops
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/DOME-Marketplace/dome-gitops
    targetRevision: HEAD
    path: ionos_sbx/security/dependency-track
    directory:
      include: dependency-track-sealed-secret.yaml
  destination:
    namespace: security
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
