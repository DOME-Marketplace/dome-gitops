apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grype
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    purpose: security
spec:
  project: default
  sources:
  - repoURL: https://ckotzbauer.github.io/helm-charts
    targetRevision: 0.31.15
    chart: vulnerability-operator
    helm:
      releaseName: vulnerability-operator
      valueFiles:
      - $values/ionos_sbx/security/grype/values.yaml
  - repoURL: https://github.com/DOME-Marketplace/dome-gitops
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/DOME-Marketplace/dome-gitops
    targetRevision: HEAD
    path: ionos_sbx/security/grype
    directory:
      include: rbac.yaml
  destination:
    namespace: security
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
