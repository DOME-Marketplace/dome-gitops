apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-module
  namespace: analytics
  labels:
    app.kubernetes.io/instance: backend-module
    app.kubernetes.io/name: backend-module
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-module
      app.kubernetes.io/name: backend-module
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: backend-module
        app.kubernetes.io/name: backend-module
    spec:
      containers:
        - name: backend-module
          image: docker.ramp.eu/dome/dome-matomo-backend-app@sha256:e7ff979d03787076ddf510d35ff7bacbd4d8fe969784ec366cbd795f3c0c026c
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
