apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-routes-config
  namespace: caddy-proxy
data:
  sbx-site.caddy: |
    
    dome-marketplace-sbx.org {
        log {
            output stdout
            format json
        }

        header {
            -Server
            -Via
        }

        request_body {
            max_size 10MiB
        }

        encode {
            gzip 1
            minimum_length 256
        }


        handle /access-node-compose-api/* {
            reverse_proxy access-node-compose-api.marketplace.svc.cluster.local:8080 {
                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }
       
        handle /* {
            
            reverse_proxy bae-marketplace-biz-ecosystem-logic-proxy.marketplace.svc.cluster.local:8004 {

                transport http {
                    dial_timeout            5s
                    response_header_timeout 60s
                }
            }
        }

        handle {
            respond "Not Found" 404
        }
        handle_errors {
            respond "Error {err.status_code}" {err.status_code}
        }
    }

